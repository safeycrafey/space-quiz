<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Exploration Quiz</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#6b7488;--border:#dfe4ef;--accent:#5b6cff;--good:#22c55e;--goodbg:#dcfce7;--bad:#ef4444;--badbg:#fee2e2;--shadow:0 8px 30px rgba(30,40,80,.12);--grid:rgba(91,108,255,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b30;--text:#e8ecf8;--muted:#98a2bd;--border:#2a3354;--accent:#7c8cff;--goodbg:#12392a;--badbg:#44181c;--shadow:0 8px 30px rgba(0,0,0,.5);--grid:rgba(124,140,255,.1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:480px}
h1{font-size:20px;margin:0 0 16px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#c084fc);transition:width .4s}
.q{font-size:16px;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--goodbg);border-color:var(--good);animation:pop .4s}
.opt.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .45s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{min-height:22px;font-size:14px;margin:4px 0 12px;font-weight:600}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.btn{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;width:100%}
.btn:hover{filter:brightness(1.1)}
.btn[hidden]{display:none}
.result{text-align:center}
.emoji{font-size:64px;animation:pop .6s}
.big{font-size:32px;font-weight:700;margin:6px 0}
.result p{color:var(--muted);margin:0 0 20px}
.best{font-size:14px;margin:-8px 0 20px}
.newbest{color:var(--good);font-weight:700;margin-left:6px}
.card{position:relative;border-radius:6px;border-color:var(--accent);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent);pointer-events:none}
.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
h1{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
h1::after{content:"● LINK ACTIVE";display:block;font-size:11px;letter-spacing:.12em;color:var(--good);margin-top:4px}
.top{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.top{gap:8px;text-transform:none;letter-spacing:0}
.cell{flex:1;border:1px solid var(--border);border-radius:3px;padding:6px 10px;background:color-mix(in srgb,var(--card) 85%,transparent)}
.cell small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cell b{display:block;font-size:20px;color:var(--text);font-variant-numeric:tabular-nums}
.cell:nth-child(2) b{color:var(--accent)}
.bar div{box-shadow:0 0 10px var(--accent);border-right:2px solid var(--text)}
.bar{height:10px;border-radius:2px;border:1px solid var(--border);background:var(--card);position:relative}
.bar div{border-radius:0}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--card) calc(10% - 2px) 10%)}
.q{font-size:17px}
.opt{border-radius:4px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;background:color-mix(in srgb,var(--card) 85%,transparent)}
.opt::before{content:attr(data-key) "  ";color:var(--accent);font-weight:700}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border-radius:4px;text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.big{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<main>
<h1>🚀 Space Exploration Quiz</h1>
<div class="card" id="card"></div>
</main>
<script>
const Q=[
["Who was the first human in space?",["Neil Armstrong","Yuri Gagarin","Alan Shepard","Buzz Aldrin"],1],
["Which year did Apollo 11 land on the Moon?",["1965","1969","1972","1975"],1],
["Which planet is known as the Red Planet?",["Venus","Jupiter","Mars","Mercury"],2],
["What was the first artificial satellite?",["Explorer 1","Vostok 1","Sputnik 1","Telstar"],2],
["Which probe left the heliosphere into interstellar space in 2012?",["Voyager 1","Pioneer 10","Cassini","New Horizons"],0],
["What is the largest moon of Saturn?",["Europa","Titan","Ganymede","Enceladus"],1],
["Which telescope launched in December 2021?",["Hubble","Kepler","James Webb","Spitzer"],2],
["Who was the first woman in space?",["Sally Ride","Valentina Tereshkova","Mae Jemison","Peggy Whitson"],1],
["Which rover landed on Mars in February 2021?",["Curiosity","Spirit","Opportunity","Perseverance"],3],
["What is the name of the first space station, launched in 1971?",["Mir","Skylab","Salyut 1","ISS"],2]
];
const card=document.getElementById("card");
function shuffle(a){a=[...a];for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
function deal(){return shuffle(Q).map(([q,o,c])=>{const s=shuffle(o.map((t,k)=>[t,k===c]));return [q,s.map(x=>x[0]),s.findIndex(x=>x[1])]})}
let G=deal(),i=0,score=0,answered=0,locked=false;
function show(){
  locked=false;
  const [q,o]=G[i];
  card.innerHTML=`<div class="fade"><div class="top">
  <div class="cell"><small>Checkpoint</small><b>${String(i+1).padStart(2,"0")}/${Q.length}</b></div>
  <div class="cell"><small>Score</small><b id="sc"></b></div>
  <div class="cell"><small>Accuracy</small><b id="acc"></b></div></div>
  <div class="bar" role="progressbar" aria-label="Mission progress" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${i}"><div style="width:${i/Q.length*100}%"></div></div>
  <p class="q"></p><div id="opts"></div><div class="fb" id="fb"></div>
  <button class="btn" id="next" hidden></button></div>`;
  card.querySelector(".q").textContent=q;
  telemetry();
  requestAnimationFrame(()=>card.querySelector(".bar div").style.width=(i/Q.length*100)+"%");
  const box=document.getElementById("opts");
  o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.key="ABCD"[k]+".";b.textContent=t;b.onclick=()=>pick(k);box.appendChild(b)});
}
function telemetry(){
  document.getElementById("sc").textContent=String(score).padStart(2,"0");
  document.getElementById("acc").textContent=answered?Math.round(score/answered*100)+"%":"--";
}
function pick(k){
  if(locked)return;locked=true;
  const a=G[i][2],bs=[...document.querySelectorAll(".opt")],fb=document.getElementById("fb");
  bs.forEach(b=>b.disabled=true);
  bs[a].classList.add("correct");
  if(k===a){score++;fb.textContent="✅ Correct!";fb.className="fb good"}
  else{bs[k].classList.add("wrong");fb.textContent="❌ Not quite — the answer is highlighted.";fb.className="fb bad"}
  answered=i+1;telemetry();
  const n=document.getElementById("next");n.hidden=false;
  n.textContent=i===Q.length-1?"See results":"Next question →";
  n.onclick=()=>{i++;i<Q.length?show():end()};n.focus();
}
const BEST_KEY="spaceQuizBest";
function loadBest(){
  try{const v=parseInt(localStorage.getItem(BEST_KEY),10);return Number.isInteger(v)&&v>=0&&v<=Q.length?v:null}catch(_){return null}
}
function saveBest(v){try{localStorage.setItem(BEST_KEY,String(v))}catch(_){}}
function end(){
  const p=score/Q.length;
  const [e,m]=p===1?["🏆","Mission commander material!"]:p>=.8?["🚀","Stellar performance!"]:p>=.5?["🌍","Solid orbit — keep exploring."]:p>=.3?["🛰️","Drifting a bit. Try again!"]:["☄️","Houston, we have a problem."];
  const prev=loadBest(),isNew=prev===null||score>prev,best=isNew?score:prev;
  if(isNew)saveBest(score);
  card.innerHTML=`<div class="result fade"><div class="bar"><div style="width:100%"></div></div><div class="emoji">${e}</div>
  <div class="big">${score} / ${Q.length}</div><p>${m}</p>
  <div class="best" role="status">Best: ${best} / ${Q.length}${isNew?' <span class="newbest">★ New best!</span>':""}</div><button class="btn" id="again">Play again</button></div>`;
  document.getElementById("again").onclick=()=>{G=deal();i=0;score=0;answered=0;show()};
}
show();
</script>
</body>
</html>
